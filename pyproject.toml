[project]
name = "rag-chatbot"
version = "0.1.0"
description = "Canadian Academic RAG Chatbot — audience-aware answers via FastAPI"
requires-python = ">=3.12"
dependencies = [
    # ── Core framework ────────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.18",
    # ── LangChain ecosystem ───────────────────────────────────────────────
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-classic>=0.1.0",          # EnsembleRetriever
    "langchain-experimental>=0.3.0",     # SemanticChunker
    "langchain-text-splitters>=0.3.0",
    # ── Embedding backend (Hugging Face Inference API) ───────────────────
    "langchain-huggingface>=0.1.0",
    "huggingface-hub>=0.23.0",
    # ── LLM provider ─────────────────────────────────────────────────────
    "openai>=1.30.0",                    # DeepSeek uses the OpenAI-compatible client
    # ── Retrieval ─────────────────────────────────────────────────────────
    "rank-bm25>=0.2.2",
    # ── Document loaders ──────────────────────────────────────────────────
    "pymupdf>=1.24.0",                   # PDF rendering (used by pymupdf4llm)
    "pymupdf4llm>=0.2.0",                # PDF → markdown conversion
    "beautifulsoup4>=4.12.0",            # WebBaseLoader HTML parsing
    "lxml>=5.0.0",                       # Fast HTML/XML parser for bs4
    # ── Audio / YouTube transcription ─────────────────────────────────────
    "ffmpeg-python>=0.2.0",
    "pytubefix>=10.10.1",                  # PoToken support to bypass bot detection
    "yt-dlp>=2024.0.0",                   # Fallback for YouTube downloads
    # ── MongoDB ──────────────────────────────────────────────────────────
    "pymongo>=4.9.0",
    # ── Configuration ─────────────────────────────────────────────────────
    "pydantic-settings>=2.3.0",
    "pydantic[email]>=2.0.0",
    "python-dotenv>=1.0.1",
    # ── Auth ────────────────────────────────────────────────────────────
    "pyjwt>=2.8.0",
    "google-auth>=2.30.0",           # Verify Google OAuth ID tokens
    "authlib>=1.3.0",                # OAuth client (redirect flow)
    "bcrypt>=4.0.0",                 # Password hashing
    "httpx>=0.27.0",                 # HTTP client (Google userinfo API)
    # ── Observability ───────────────────────────────────────────────────
    "langsmith>=0.8.8",
    "langchain-deepseek>=1.1.0",
    "qdrant-client>=1.18.0",
    "langchain-qdrant>=0.2.0",
    "fastembed>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
scripts = [
    "sentence-transformers>=5.6.0",      # Only used by legacy test scripts
]
# Local OpenVINO embeddings (GPU-accelerated) — install with:
#   pip install -e ".[openvino]"
openvino = [
    "optimum[nncf,openvino]>=2.2.0",
    "optimum-intel>=1.23.0",
    "openvino>=2025.0.0",
    "openvino-tokenizers>=2025.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ── Ruff (linter + formatter) ─────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI dependency injection legitimately calls Depends() in defaults.
ignore = ["E501", "B008"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
