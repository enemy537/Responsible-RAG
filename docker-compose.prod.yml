# =============================================================================
# docker-compose.prod.yml — Production overrides
# =============================================================================
# Use with:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
# Sets the correct URLs for production using your DOMAIN from .env.
# =============================================================================

# ── Named volumes for Caddy's certificates and configuration ────────────────
volumes:
  caddy_data:
  caddy_config:

services:

  # ---------------------------------------------------------------------------
  # Caddy — Reverse proxy: terminates TLS (Let's Encrypt) for ${DOMAIN}
  # ---------------------------------------------------------------------------
  # Production-only. It binds the privileged ports 80/443 and 404s direct-IP
  # access, so it belongs to the prod stack instead of the base file. Dev starts
  # without it and reaches the frontend/backend directly.
  caddy:
    image: caddy:2-alpine
    container_name: rag-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      args:
        # In production, Caddy serves as the reverse proxy, so the relative
        # path /api/v1 is sufficient (same origin).
        VITE_API_URL: /api/v1

  backend:
    environment:
      FRONTEND_URL: https://${DOMAIN}
      GOOGLE_REDIRECT_URI: https://${DOMAIN}/api/v1/auth/google/callback
    # Production resource limits — no GPU, minimal memory footprint
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2G"
        reservations:
          cpus: "0.5"
          memory: "512M"

  # Production Qdrant — no gRPC port exposed, resource limits
  qdrant:
    ports:
      - "6333:6333"   # REST API only (no gRPC in prod)
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "1G"
        reservations:
          cpus: "0.5"
          memory: "256M"

  # Production MongoDB — no port exposed externally (access via internal network only)
  mongo:
    ports: []
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "1G"
        reservations:
          cpus: "0.5"
          memory: "256M"


