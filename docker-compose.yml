# =============================================================================
# docker-compose.yml — development stack
# =============================================================================
# Dev:     docker compose -f docker-compose.yml up --build -d
# Prod:    docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
# Stop:    docker compose down
# Logs:    docker compose logs -f <service>
#
# Caddy (the TLS reverse proxy) is defined in docker-compose.prod.yml, not here.
# It binds the privileged ports 80/443 and requires a public domain, so it is
# production infrastructure. In dev, reach the frontend on :3000 and the
# backend on :8000 directly.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # qdrant — Off-the-shelf, vector database on the host
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-server
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    volumes:
      - ../storage/qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MongoDB — Off-the-shelf, data persisted on the host
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7
    container_name: rag-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-rag}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-ragpassword}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-responsible_rag}
      # App user credentials (used by init.js to create a limited-privilege user)
      MONGO_APP_USER: ${MONGO_APP_USER:-rag}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-ragpassword}
    volumes:
      # Host-backed persistence: data survives container restarts & rebuilds.
      # Must exist and be EMPTY for the init script below to run.
      - ../storage/mongo/data:/data/db
      # First-run bootstrap: creates the application user inside the
      # application database. Only executed while /data/db is empty.
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/01-init.js:ro

    healthcheck:
      # Liveness only. `ping` needs no credentials, so a wrong application
      # password can no longer mask whether mongod itself has started.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Frontend (Vite + React via nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        # Relative path — the frontend nginx proxies /api/v1/ to backend:8000.
        # Override only if you need an external backend URL.
        VITE_API_URL: /api/v1
    image: rag-frontend:latest
    container_name: rag-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Backend (FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: rag-backend:latest
    container_name: rag-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Docker frontend serves on port 3000 (dev) or behind Caddy (prod)
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Point to the local Docker MongoDB service
      # Default auth: authenticates against the target database
      # (responsible_rag). No authSource needed — the user must exist
      # in the target DB (created by init.js on first run).
      MONGO_URI: ${MONGO_URI:-mongodb://rag:ragpassword@mongo:27017/responsible_rag}
      # Point to the Docker Qdrant service
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
    volumes:
      # All data dirs live outside the project tree (../storage/) to avoid
      # git tracking.  The app looks for them at ../storage/<name> which
      # resolves to /storage/<name> inside the container.
      - ../storage/resources:/storage/resources:ro
      - ../storage/uploads:/storage/uploads
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Run as appuser (UID 1000). Make sure ../storage/* directories are owned by 1000:1000
    # on the host (run: sudo chown -R 1000:1000 ..//storage).
    user: "1000:1000"hand edited
# hand edit
