# =============================================================================
# ci.yml — lint, test and build on every pull request
# =============================================================================
# Also callable from deploy.yml (workflow_call) so a release runs the exact
# same gate before it touches production.
#
# NOTE: this workflow deliberately does NOT start Qdrant. The dataset
# integration tests assert facts about the real 6452/7272-point collections and
# self-skip when it is unreachable. Running an empty Qdrant would make them
# fail, so Mongo gets a throwaway service container and Qdrant stays absent.
# =============================================================================
# ready to deploy: `gh workflow run deploy.yml --ref main`
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint + tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: |
          python -m pip install --quiet --disable-pip-version-check ruff
          ruff check backend tests

      - name: Build images
        run: |
          docker build -f backend/Dockerfile -t rag-backend:local .
          docker build -f backend/Dockerfile.test -t rag-backend:test .

      - name: Tests
        run: |
          docker run --rm --network host \
            -e TEST_MONGO_URI="mongodb://127.0.0.1:27017/responsible_rag_ci_test" \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD/tests:/app/tests:ro" \
            rag-backend:test

  frontend:
    name: Frontend — types + lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # package-lock.json is lockfileVersion 2 and does not list the optional
      # native binaries, so `npm ci` alone leaves vite/rollup unable to start.
      - name: Install optional native binaries
        run: |
          npm install --no-save --no-package-lock \
            @rollup/rollup-linux-x64-gnu lightningcss-linux-x64-gnu

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npx eslint .

      - name: Build
        run: npx vite build --outDir /tmp/dist

      # Production deploys build this image on the server, so validate the
      # Dockerfile here — a broken one would only surface mid-deploy otherwise.
      - name: Build production image
        working-directory: .
        run: |
          docker build -f frontend/Dockerfile -t rag-frontend:ci ./frontend \
            --build-arg VITE_API_URL=/api/v1
